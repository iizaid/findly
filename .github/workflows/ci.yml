name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: findly
          POSTGRES_PASSWORD: findly
          POSTGRES_DB: findly_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: server
    env:
      DATABASE_URL: postgresql://findly:findly@localhost:5432/findly_test?schema=public
      NODE_ENV: test
      PORT: 4100
      CLIENT_ORIGIN: http://localhost:5173
      SESSION_SECRET: ci-session-secret-that-is-long-enough-for-findly
      COOKIE_NAME: findly_ci_session
      CSRF_COOKIE_NAME: findly_ci_csrf
      SESSION_TTL_DAYS: 30
      BCRYPT_ROUNDS: 10
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX: 1000
      AUTH_RATE_LIMIT_MAX: 1000
      SIGNUP_RATE_LIMIT_MAX: 1000
      LOGIN_RATE_LIMIT_MAX: 1000
      SEARCH_RATE_LIMIT_MAX: 1000
      ANALYSIS_RATE_LIMIT_MAX: 1000
      JSON_BODY_LIMIT: 100kb
      URLENCODED_BODY_LIMIT: 50kb
      TRUST_PROXY: 0
      MAX_ACTIVE_SESSIONS: 10
      EMAIL_VERIFICATION_TTL_MINUTES: 60
      VERIFICATION_RESEND_COOLDOWN_SECONDS: 60
      APP_URL: http://localhost:4000
      CLIENT_URL: http://localhost:5173
      EMAIL_FROM: Findly <test@findly.local>
      LOG_LEVEL: silent
      DATASET_IMPORT_DIR: ./tests/fixtures/dataset-import
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run prisma:generate
      - run: npx prisma migrate deploy
      - run: npx prisma validate
      - run: npm run lint
      - run: npm test
