services:
  findly-postgis:
    image: postgis/postgis:16-3.4
    container_name: findly-postgis
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: findly
    ports:
      - "5433:5432"
    volumes:
      - findly_postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d findly"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  findly_postgis_data:
